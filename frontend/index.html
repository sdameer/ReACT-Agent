<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAct Agent | Live Token Streaming</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-bubble: #2563eb;
            --ai-bubble: #334155;
            --tool-bg: #475569;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #38bdf8;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .title-group h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
        }

        .title-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .toolbar {
            width: 100%;
            max-width: 800px;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(30, 41, 59, 0.5);
        }

        .toolbar button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            color: var(--text-color);
            border-color: var(--accent);
        }

        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message.ai .bubble {
            background-color: var(--ai-bubble);
            border-bottom-left-radius: 4px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tool-card {
            background-color: var(--tool-bg);
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .tool-card .tool-title {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 15px;
            background-color: var(--accent);
            margin-left: 3px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #input-area {
            width: 100%;
            max-width: 800px;
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: var(--accent);
        }

        #send-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>⚡ ReAct Agent Stream</h1>
            <p>FastAPI + LangGraph + Server-Sent Events (SSE)</p>
        </div>
        <div class="status-badge" id="status-badge">
            <div class="status-dot"></div>
            <span>Connected</span>
        </div>
    </header>

    <div class="toolbar">
        <div>Thread ID: <span id="thread-id-display" style="font-family: monospace;">New Thread</span></div>
        <button id="new-chat-btn" onclick="startNewChat()">+ New Conversation</button>
    </div>

    <div id="chat-container">
        <div class="message ai">
            <div class="bubble">Hello! I am your ReAct arithmetic assistant. Ask me multi-step math problems (e.g. <em>"Add 15 and 25 then multiply by 3"</em>) and watch me invoke tools and stream results live!</div>
        </div>
    </div>

    <div id="input-area">
        <form id="chat-form">
            <input type="text" id="message-input" placeholder="Type an instruction or calculation..." autocomplete="off" required>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        let currentThreadId = null;
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const threadIdDisplay = document.getElementById('thread-id-display');

        function startNewChat() {
            currentThreadId = null;
            threadIdDisplay.textContent = 'New Thread';
            chatContainer.innerHTML = `
                <div class="message ai">
                    <div class="bubble">Started a fresh conversation. How can I help you?</div>
                </div>
            `;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            // 1. Add User Message to UI
            appendMessage('user', message);
            messageInput.value = '';
            setLoading(true);

            // 2. Prepare AI Container for incoming chunks
            const { aiMessageElem, bubbleElem, toolsContainer } = createAIMessageElement();

            try {
                // 3. Request SSE stream via POST
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        user_name: 'ameer',
                        thread_id: currentThreadId
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                // 4. Read the stream using ReadableStream + TextDecoder
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let cursor = createCursor();
                bubbleElem.appendChild(cursor);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop(); // keep trailing incomplete chunk

                    for (const eventBlock of events) {
                        const trimmed = eventBlock.trim();
                        if (!trimmed.startsWith('data:')) continue;

                        const jsonStr = trimmed.replace(/^data:\s*/, '');
                        try {
                            const data = JSON.parse(jsonStr);
                            handleEvent(data, bubbleElem, toolsContainer, cursor);
                        } catch (err) {
                            console.error('Failed to parse SSE JSON:', jsonStr, err);
                        }
                    }
                }

                if (cursor.parentNode) {
                    cursor.remove();
                }

            } catch (err) {
                console.error('Streaming error:', err);
                bubbleElem.textContent = '⚠️ Error: ' + err.message;
            } finally {
                setLoading(false);
            }
        });

        function handleEvent(data, bubbleElem, toolsContainer, cursor) {
            if (data.type === 'token') {
                // Insert token before cursor
                cursor.insertAdjacentText('beforebegin', data.content);
                scrollToBottom();
            } else if (data.type === 'tool_start') {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.id = `tool-${data.tool}`;
                card.innerHTML = `
                    <div class="tool-title">⚡ Calling Tool: <code>${data.tool}</code></div>
                    <div>Input: <code>${JSON.stringify(data.input)}</code></div>
                `;
                toolsContainer.appendChild(card);
                scrollToBottom();
            } else if (data.type === 'tool_end') {
                const card = document.getElementById(`tool-${data.tool}`);
                if (card) {
                    const resultLine = document.createElement('div');
                    resultLine.style.color = '#4ade80';
                    resultLine.style.marginTop = '4px';
                    resultLine.innerHTML = `Result: <strong>${data.output}</strong>`;
                    card.appendChild(resultLine);
                }
                scrollToBottom();
            } else if (data.type === 'done') {
                if (data.thread_id) {
                    currentThreadId = data.thread_id;
                    threadIdDisplay.textContent = currentThreadId;
                }
            } else if (data.type === 'error') {
                bubbleElem.textContent = '⚠️ Agent error: ' + data.content;
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function createAIMessageElement() {
            const aiMessageElem = document.createElement('div');
            aiMessageElem.className = 'message ai';

            const toolsContainer = document.createElement('div');
            aiMessageElem.appendChild(toolsContainer);

            const bubbleElem = document.createElement('div');
            bubbleElem.className = 'bubble';
            aiMessageElem.appendChild(bubbleElem);

            chatContainer.appendChild(aiMessageElem);
            scrollToBottom();
            return { aiMessageElem, bubbleElem, toolsContainer };
        }

        function createCursor() {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            return cursor;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            messageInput.disabled = loading;
            if (!loading) messageInput.focus();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
